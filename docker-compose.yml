# ========================================
#  Filharmonia AI - Docker Compose
#  Easy setup for all platforms
# ========================================

version: '3.8'

services:
  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: backend-dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/data  # Mount your audio files here
      - backend-venv:/app/backend/venv
    environment:
      - PYTHONUNBUFFERED=1
      - FILHARMONIA_BASE_DIR=/data
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Dev Server
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend-modules:/app/frontend/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    command: pnpm dev --host 0.0.0.0
    depends_on:
      - backend

volumes:
  backend-venv:
  frontend-modules:
