# ========================================
#  Filharmonia AI - Docker Compose
#  Easy setup for all platforms
# ========================================

services:
  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: backend-dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - FILHARMONIA_BASE_DIR=/data
      - NVIDIA_VISIBLE_DEVICES=all
    working_dir: /app/backend
    command: python -m uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Dev Server
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend-modules:/app/frontend/node_modules
    environment:
      - VITE_API_URL=http://backend:8000
      - VITE_PROXY_TARGET=http://backend:8000
    command: pnpm dev --host 0.0.0.0
    depends_on:
      - backend

volumes:
  frontend-modules:
